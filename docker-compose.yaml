services:
  app:
    image: abdulk07/annon:v1  # or use build: . to build from Dockerfile
    ports:
      - "8000:3000"
    env_file:
      - .env

  anonymous_db:
    image: postgres:15
    container_name: anonymous_postgres_container
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432" # Changed local port to 5433 to avoid conflict with standard Postgres
    volumes:
      - anonymous_pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1'
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: anonymous_pgbouncer_container
    restart: always
    environment:
      - DB_HOST=anonymous_db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - POOL_MODE=transaction
      - DEFAULT_POOL_SIZE=2
      - MAX_CLIENT_CONN=2000
      - AUTH_TYPE=scram-sha-256       
    ports:
      - "6432:5432" # This maps your computer's 6432 to PgBouncer's internal 5432
    depends_on:
      - anonymous_db
volumes:
  anonymous_pg_data: